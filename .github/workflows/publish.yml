name: publish

# Releases go to PyPI through trusted publishing (OIDC): no API token is stored anywhere.
#   - push a tag vX.Y.Z that matches swarmly.__version__  -> PyPI   (environment "pypi")
#   - run this workflow by hand (Actions -> publish)        -> TestPyPI (environment "testpypi")
# Each target needs a trusted publisher registered on (Test)PyPI for this repository, this
# workflow file (publish.yml) and that environment name; docs/RELEASING.md has the steps.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned by commit SHA; the comment names the release.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: The tag names the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('swarmly/__init__.py').read_text()).group(1))")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: The suite passes on this commit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          python -m unittest discover tests
      - name: Build and check the sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke-test the wheel in a clean venv
        working-directory: /tmp
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          /tmp/smoke/bin/swarmly-telegram --help
          /tmp/smoke/bin/swarmly --help
          mkdir -p /tmp/proj && cd /tmp/proj
          /tmp/smoke/bin/swarmly-telegram init --alias Tester --adapter echo --bus-repo .
          /tmp/smoke/bin/swarmly-keygen --agent tester --env-file /tmp/t.env --registry config/a2a_config.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    # A pushed tag only: a manual run started from a tag goes to TestPyPI, never here.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/swarmly/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/swarmly/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
